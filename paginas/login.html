    <main class="principal-login">
        <img src="../imagens/login/login.png" width="260px">

        <form id="form-login">
            <div class="mb-3">
                <label for="email" class="form-label">E-mail *</label>
                <input type="email" class="form-control" id="email" name="email" aria-describedby="emailHelp" placeholder="Digite seu e-mail" required>
                <div id="emailHelp" class="form-text" >Nós nunca iremos compartilhar seu e-mail com ninguém.</div>
            </div>
            <div class="mb-3">
                <label for="senha" class="form-label">Senha *</label>
                <input type="password" class="form-control" id="senha" name="senha" placeholder="Digite sua senha" required>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="mostrarSenha" name="checar">
                <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
            </div>
            <button type="submit" class="btn btn-primary btn-entrar-login">Entrar</button>
        </form>

    </main>
