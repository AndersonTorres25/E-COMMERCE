<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop TADS</title>

    <link href="css/estilo.css" rel="stylesheet" />

    <link rel="icon" href="imagens/index/favicon.ico">

</head>

<body>
    <header class="cabecalho">

        <div id="logo-produto">
            <a href="https://www.ifg.edu.br/" target="_blank">
                <img src="imagens/Instituto_Federal_de_Goiás_-_Marca_Vertical_2015777.svg" alt="Logo IFG" width="100"
                    height="50">
            </a>

            <!-- <a href="index.html">
                <img src="imagens/SHOP-TADS.png" alt="Logo Shop TADS" width="50" height="45" />
            </a>
            -->
        </div>

        <div class="pesquisa">
            <input type="search" placeholder="Buscar produto" />
            <button>Pesquisar</button>
        </div>

        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="paginas/produtos.html">Produtos</a>
            <a href="paginas/contato.html" target="_self">Contato</a>
            <a href="paginas/carrinho.html">
                <img src="imagens/carrinho/carrinho.png" alt="carrinho" width="35px">
            </a>

        </nav>
    </header>

    <main class="principal">
        <!--evento JS: onmouseover, onmouseout -->
        <section>
            <marquee onmouseover="this.stop()" onmouseout="this.start()" width="100%" direction="right">

                <h1 style="text-align:center;">
                    Bem-vindo ao Shop TADS
                </h1>

            </marquee>

            <div class="banner">
                <div class="botoes-banner">
                    <a href="paginas/produtos.html">Produtos</a>
                    <a href="paginas/contato.html">Contato</a>
                </div>

            </div>
        </section>





    </main>




    <footer>

        <div class="redes-sociais">

            <a href="https://facebook.com" target="_blank">
                <img src="imagens/redes/logo-facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="imagens/redes/logo-instagram.svg" alt="Instagram">
            </a>

            <a href="https://www.youtube.com/" target="_blank">
                <img src="imagens/redes/logo-youtube.svg" alt="YouTube">
            </a>

        </div>

        <p>&copy 2026 Shop TADS</p>

    </footer>

</body>

</html>
