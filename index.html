<!DOCTYPE html>
<html lang="pt-br">

<head>

    <link href="css/estilo.css" rel="stylesheet" />

<body>
    <header class="cabecalho">

        <div id="logo-produto">
            <a href="https://www.ifg.edu.br/" target="_blank">
                <img src="imagens/Instituto_Federal_de_Goiás_-_Marca_Vertical_2015777.svg" alt="Logo IFG" width="100"
                    height="50">
            </a>

            <div class="dados-usuario">
                <p><i>Olá, Mr.</i>
                </p>

                <div id="usuario">
                    <a href="">Cadastrar></a>
                </div>
                <div>
                    <a href="paginas/login.html">Logar</a>
                </div>
            </div>

            <!-- <a href="index.html">
                <img src="imagens/SHOP-TADS.png" alt="Logo Shop TADS" width="50" height="45" />
            </a>
            -->

        <div class="pesquisa">
            <input type="search" placeholder="Buscar produto" />

        <nav class="nav">
            <a href="index.html">Início</a>
            <a href="paginas/produtos.html">Produtos</a>

    <main class="principal">

            <h1 style="text-align:center;">
                Bem-vindo ao Shop TADS
            </h1>

        </marquee>
        <div id="carouselExampleIndicators" class="carousel slide">
            <div class="carousel-indicators">
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active"
                    aria-current="true" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="imagens/index/BANNER.PNG" class="d-block w-100" alt="...">
                    <div class="botoes-banner">
                        <a href="paginas/produtos.html">Produtos</a>
                        <a href="paginas/contato.html">Contato</a>
                    </div>
                </div>
                <div class="carousel-item">
                    <img src="..." class="d-block w-100" alt="...">
                </div>
                <div class="carousel-item">
                    <img src="..." class="d-block w-100" alt="...">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
        
    </main>


    <footer>

        <div class="redes-sociais">

            <a href="https://facebook.com" target="_blank">
                <img src="imagens/redes/logo-facebook.svg" alt="Facebook">
            </a>

            <a href="https://instagram.com" target="_blank">
                <img src="imagens/redes/logo-instagram.svg" alt="Instagram">
            </a>

            <a href="https://www.youtube.com/" target="_blank">

            </a>

        <p>&copy 2026 Shop TADS</p>
